name: Catalog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/catalog.py check
      - run: python3 scripts/catalog.py build
      - run: git diff --check
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
      - run: python3 -B scripts/test_video_agent_kit.py
  publish:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/catalog.py build
            git add -- marketplace.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(market): refresh plugin catalog"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
